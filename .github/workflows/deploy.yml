name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

# Permissions required for deploying to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    name: Build Application
    runs-on: ubuntu-latest
    outputs:
      base_url: ${{ steps.determine-base.outputs.base_url }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Determine BASE_URL
        id: determine-base
        run: |
          REPO_FULL="${{ github.repository }}"
          REPO_OWNER="${{ github.repository_owner }}"
          REPO_NAME="${REPO_FULL#*/}"

          # If the repository is a user/organization site (<owner>.github.io), root is /
          # Otherwise for project repositories (<owner>/<repo>), root is /<repo>/
          if [ "$REPO_NAME" = "${REPO_OWNER}.github.io" ]; then
            BASE_PATH="/"
          else
            BASE_PATH="/${REPO_NAME}/"
          fi

          echo "Repository Owner: $REPO_OWNER"
          echo "Repository Name:  $REPO_NAME"
          echo "Determined BASE_URL: $BASE_PATH"

          echo "BASE_URL=$BASE_PATH" >> $GITHUB_ENV
          echo "base_url=$BASE_PATH" >> $GITHUB_OUTPUT

      - name: Install Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          else
            npm install --legacy-peer-deps
          fi

      - name: Build with Vite
        env:
          BASE_URL: ${{ steps.determine-base.outputs.base_url }}
        run: |
          npm run build -- --base="${{ steps.determine-base.outputs.base_url }}"

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
